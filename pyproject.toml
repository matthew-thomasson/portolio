[project]
name = "substackdownloader"
version = "0.1.0"
description = "Substack downloader, Datawrapper extractor, and portfolio recommendation backtester for Beating The Tide"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beautifulsoup4>=4.12.0",
    "pandas>=2.2.0",
    "pydantic>=2.14.3",
    "python-dotenv>=1.0.1",
    "requests>=2.32.0",
    "rich>=13.9.0",
    "yfinance>=0.2.50",
]

[project.scripts]
btt = "btt_sim.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["btt_sim"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
]
